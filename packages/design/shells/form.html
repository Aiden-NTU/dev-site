<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="/ah.css" />
  </head>
  <body>
    <div class="ah-shell">
      <header class="ah-header">
        <a class="ah-brand" href="https://aidenhawkins.dev/">aidenhawkins.dev</a>
      </header>
      <main class="ah-main">
        <div class="ah-auth-box">
          <h1>{{title}}</h1>
          <p class="ah-muted">{{summary}}</p>
          <form method="post" action="{{action}}">
            {{fields}}
            <button class="ah-btn ah-btn-primary" type="submit">{{submitLabel}}</button>
          </form>
          {{footer}}
        </div>
      </main>
    </div>
  </body>
</html>
