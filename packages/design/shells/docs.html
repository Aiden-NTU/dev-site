<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · aidenhawkins.dev</title>
    <link rel="stylesheet" href="/ah.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  </head>
  <body>
    <div class="ah-shell">
      <header class="ah-header">
        <a class="ah-brand" href="/">aidenhawkins.dev</a>
        <nav class="ah-nav">
          <a href="/projects">Projects</a>
          <a href="/learn" aria-current="page">Learn</a>
          <a href="/login">Log in</a>
        </nav>
      </header>
      <main class="ah-main ah-main-wide">
        <div class="ah-layout-docs">
          <aside class="ah-sidebar">{{sidebar}}</aside>
          <article class="ah-md">
            <h1>{{title}}</h1>
            {{body}}
            {{interactive}}
          </article>
        </div>
      </main>
      <footer class="ah-footer">Learning vault · Obsidian markdown → interactive over time</footer>
    </div>
    <script src="/ah.js" defer></script>
  </body>
</html>
