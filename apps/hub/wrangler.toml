name = "aidenhawkins-site"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ah-hub"
database_id = "17269351-e9d5-469e-9b60-32dff1020349"
migrations_dir = "migrations"

[vars]
APP_URL = "https://aidenhawkins.dev"

[[routes]]
pattern = "aidenhawkins.dev"
custom_domain = true
